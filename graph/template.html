<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AI Safety Papers — Relationship Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/dist/vis-network.min.js"></script>
<style>
  :root{
    --bg:#0e1116; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --tx:#e6e8ec; --mut:#9aa1ad;
    --interp:#4C82F7; --security:#E5484D; --privacy:#30A46C; --other:#8B8D98;
    --extends:#12A594; --baseline:#F5A524; --compares:#8E4EC6; --rebuts:#E5484D;
    --author:#3E63DD; --topic:#5Fae8c; --cite:#3b414d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;font-size:13px}
  #net{position:absolute;inset:0}
  .panel{position:absolute;background:rgba(23,26,33,.94);border:1px solid var(--line);
    border-radius:10px;backdrop-filter:blur(6px);box-shadow:0 6px 24px rgba(0,0,0,.35)}
  #controls{top:12px;left:12px;width:246px;padding:12px 13px;max-height:calc(100vh - 24px);overflow:auto}
  #controls h1{font-size:13px;margin:0 0 2px;letter-spacing:.2px}
  #controls .sub{color:var(--mut);font-size:11px;margin-bottom:10px}
  .grp{margin:11px 0 4px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  label.row{display:flex;align-items:center;gap:7px;padding:3px 0;cursor:pointer;user-select:none}
  label.row .sw{width:12px;height:12px;border-radius:3px;flex:none}
  label.row .ln{width:16px;height:0;border-top-width:3px;border-top-style:solid;flex:none}
  input[type=checkbox]{accent-color:#4C82F7}
  #search{width:100%;padding:7px 9px;background:var(--panel2);border:1px solid var(--line);
    border-radius:7px;color:var(--tx);outline:none}
  #results{margin-top:5px;max-height:168px;overflow:auto;display:none}
  #results .r{padding:5px 7px;border-radius:6px;cursor:pointer;font-size:12px;line-height:1.25}
  #results .r:hover{background:var(--panel2)}
  #results .r .c{font-size:10px;color:var(--mut)}
  .btn{display:inline-block;margin:3px 4px 0 0;padding:5px 9px;background:var(--panel2);
    border:1px solid var(--line);border-radius:6px;color:var(--tx);cursor:pointer;font-size:12px}
  .btn:hover{border-color:#3a4150}
  .btn.on{background:#26406e;border-color:#3E63DD}
  input[type=range]{width:100%;accent-color:#4C82F7}
  #dateout{color:var(--mut);font-size:11px}
  #detail{top:12px;right:12px;width:308px;padding:14px;display:none;max-height:calc(100vh - 24px);overflow:auto}
  #detail .close{position:absolute;top:9px;right:11px;color:var(--mut);cursor:pointer;font-size:16px}
  #detail h2{font-size:14px;margin:0 8px 6px 0;line-height:1.3}
  #detail .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;color:#0b0d10}
  #detail .meta{color:var(--mut);font-size:11px;margin:7px 0}
  #detail .kw{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
  #detail .kw span{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-size:10px}
  #detail a{color:#7aa2ff;text-decoration:none} #detail a:hover{text-decoration:underline}
  #detail .rel{margin-top:10px} #detail .rel h3{font-size:11px;color:var(--mut);
    text-transform:uppercase;letter-spacing:.5px;margin:8px 0 4px;border-top:1px solid var(--line);padding-top:8px}
  #detail .rel .item{padding:3px 0;line-height:1.3} #detail .rel .item .t{font-size:12px}
  #detail .rel .item .lab{font-size:10px;padding:1px 5px;border-radius:4px;color:#0b0d10;font-weight:600;margin-right:5px}
  #legend{bottom:12px;left:12px;padding:10px 12px;font-size:11px;color:var(--mut);max-width:246px}
  #legend b{color:var(--tx);font-weight:600}
  #stats{bottom:12px;right:12px;padding:8px 11px;font-size:11px;color:var(--mut)}
  #hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);color:var(--mut);
    font-size:11px;background:rgba(23,26,33,.8);padding:5px 11px;border-radius:20px;border:1px solid var(--line)}
  a.linkbtn{display:inline-block;margin:8px 6px 0 0;padding:6px 11px;border-radius:7px;
    background:#26406e;border:1px solid #3E63DD;color:#dbe6ff !important;text-decoration:none!important;font-size:12px}
</style>
</head>
<body>
<div id="net"></div>

<div id="controls" class="panel">
  <h1>📄 Papers Relationship Graph</h1>
  <div class="sub" id="subtitle"></div>

  <input id="search" placeholder="🔎 제목·저자 검색"/>
  <div id="results"></div>

  <div class="grp">관계 (엣지)</div>
  <label class="row"><input type="checkbox" id="e_cite" checked><span class="ln" style="border-color:var(--cite)"></span> 인용 (A→B)</label>
  <label class="row"><input type="checkbox" id="e_author" checked><span class="ln" style="border-color:var(--author)"></span> 공저자</label>
  <label class="row"><input type="checkbox" id="e_topic"><span class="ln" style="border-color:var(--topic);border-top-style:dashed"></span> 주제 유사도</label>
  <div style="height:6px"></div>
  <label class="row"><input type="checkbox" id="e_semonly"> 의미 라벨 엣지만 (확장/베이스라인/반박)</label>

  <div class="grp">분야</div>
  <label class="row"><input type="checkbox" id="c_interp" checked><span class="sw" style="background:var(--interp)"></span> interpretability</label>
  <label class="row"><input type="checkbox" id="c_security" checked><span class="sw" style="background:var(--security)"></span> security</label>
  <label class="row"><input type="checkbox" id="c_privacy" checked><span class="sw" style="background:var(--privacy)"></span> privacy</label>
  <label class="row"><input type="checkbox" id="c_other" checked><span class="sw" style="background:var(--other)"></span> other</label>

  <div class="grp">기간 (first seen)</div>
  <input type="range" id="dmin" min="0" max="0" value="0"/>
  <input type="range" id="dmax" min="0" max="0" value="0"/>
  <div id="dateout"></div>

  <div class="grp">보기</div>
  <span class="btn" id="btnPhysics">물리 ON</span>
  <span class="btn" id="btnNeighbors">이웃만 강조</span>
  <span class="btn" id="btnFit">전체 보기</span>
</div>

<div id="detail" class="panel"><span class="close" id="detClose">✕</span><div id="detBody"></div></div>

<div id="legend" class="panel">
  <b>노드</b> = 논문 · 색 = 분야 · 크기 = 코퍼스 내 피인용수(영향력)<br>
  <b>엣지</b>: <span style="color:var(--cite)">인용</span> ·
  <span style="color:var(--extends)">확장</span> ·
  <span style="color:var(--baseline)">베이스라인</span> ·
  <span style="color:var(--compares)">비교</span> ·
  <span style="color:var(--rebuts)">반박</span> ·
  <span style="color:var(--author)">공저자</span> ·
  <span style="color:var(--topic)">주제</span>
</div>

<div id="stats" class="panel"></div>
<div id="hint">노드를 클릭하면 상세·관계가 보입니다</div>

<script>/*__GRAPH_DATA__*/</script>
<script>
const G = window.GRAPH || {nodes:[],edges:[],meta:{}};
const CAT = {interp:getCSS('--interp'),security:getCSS('--security'),privacy:getCSS('--privacy'),other:getCSS('--other')};
const SUB = {cite:getCSS('--cite'),extends:getCSS('--extends'),baseline:getCSS('--baseline'),compares:getCSS('--compares'),rebuts:getCSS('--rebuts'),background:getCSS('--cite')};
const SUBLAB = {extends:'확장',baseline:'베이스라인',compares:'비교',rebuts:'반박',background:'배경',cite:'인용'};
function getCSS(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

// ---- dates ----
const dates = [...new Set(G.nodes.map(n=>n.date).filter(Boolean))].sort();
const dIdx = Object.fromEntries(dates.map((d,i)=>[d,i]));
['dmin','dmax'].forEach(id=>{const el=document.getElementById(id);el.max=dates.length-1;});
document.getElementById('dmin').value=0;
document.getElementById('dmax').value=dates.length-1;

// ---- adjacency for detail panel ----
const byId = Object.fromEntries(G.nodes.map(n=>[n.id,n]));
const outC={},inC={},auth={},topi={};
for(const e of G.edges){
  if(e.etype==='cite'){(outC[e.from]=outC[e.from]||[]).push(e);(inC[e.to]=inC[e.to]||[]).push(e);}
  else if(e.etype==='author'){(auth[e.from]=auth[e.from]||[]).push(e.to);(auth[e.to]=auth[e.to]||[]).push(e.from);}
  else if(e.etype==='topic'){(topi[e.from]=topi[e.from]||[]).push(e.to);(topi[e.to]=topi[e.to]||[]).push(e.from);}
}

// ---- vis datasets ----
const nodesDS = new vis.DataSet(G.nodes.map(n=>({
  id:n.id, label:n.label,
  color:{background:CAT[n.cat]||CAT.other, border:shade(CAT[n.cat]||CAT.other),
         highlight:{background:CAT[n.cat]||CAT.other,border:'#fff'}},
  size: 8 + Math.sqrt(n.indeg)*4.2,
  font:{color:'#c7ccd6', size: 11 + Math.min(n.indeg,10)*0.7, face:'-apple-system'},
  _cat:n.cat, _date:n.date
})));
let eid=0;
const edgesDS = new vis.DataSet(G.edges.map(e=>{
  const isCite = e.etype==='cite';
  const col = isCite ? (SUB[e.subtype]||SUB.cite)
            : e.etype==='author' ? getCSS('--author') : getCSS('--topic');
  const semantic = isCite && ['extends','baseline','compares','rebuts'].includes(e.subtype);
  return {
    id:'e'+(eid++), from:e.from, to:e.to,
    arrows: isCite ? {to:{enabled:true,scaleFactor:.45}} : undefined,
    color:{color:col, opacity: e.etype==='topic'?0.5:(semantic?0.9:0.55), highlight:'#fff'},
    width: e.etype==='author' ? Math.min(1+(e.weight||1)*0.5,3)
         : semantic ? 2 : e.etype==='topic'?0.6:1,
    dashes: e.etype==='topic' ? [3,4] : (e.subtype==='rebuts'?[6,4]:false),
    smooth:{enabled:true,type:'continuous',roundness:.2},
    _etype:e.etype, _sub:isCite?e.subtype:null, _sem:semantic
  };
}));

// ---- filtering via DataViews ----
const state={cite:true,author:true,topic:false,semonly:false,
  cats:{interp:true,security:true,privacy:true,other:true},dmin:0,dmax:dates.length-1};
function nodeVisible(n){
  if(!state.cats[n._cat]) return false;
  const di = dIdx[n._date]; if(di===undefined) return true;
  return di>=state.dmin && di<=state.dmax;
}
const nodesView=new vis.DataView(nodesDS,{filter:nodeVisible});
function edgeVisible(e){
  if(!state[e._etype]) return false;
  if(state.semonly && !e._sem) return false;
  const a=nodesDS.get(e.from), b=nodesDS.get(e.to);
  if(!a||!b||!nodeVisible(a)||!nodeVisible(b)) return false;
  return true;
}
const edgesView=new vis.DataView(edgesDS,{filter:edgeVisible});

// ---- network ----
const container=document.getElementById('net');
const net=new vis.Network(container,{nodes:nodesView,edges:edgesView},{
  physics:{enabled:true,stabilization:{iterations:220},barnesHut:{gravitationalConstant:-9000,springLength:120,springConstant:.035,avoidOverlap:.3}},
  interaction:{hover:true,tooltipDelay:120,navigationButtons:false,keyboard:false},
  nodes:{shape:'dot',borderWidth:1.5},
  edges:{selectionWidth:1.6}
});
net.once('stabilizationIterationsDone',()=>{net.setOptions({physics:{enabled:false}});physicsOn=false;btnPhysics.classList.remove('on');btnPhysics.textContent='물리 OFF';});

function refresh(){nodesView.refresh();edgesView.refresh();}

// ---- controls wiring ----
const bind=(id,key)=>{document.getElementById(id).addEventListener('change',e=>{state[key]=e.target.checked;refresh();});};
bind('e_cite','cite');bind('e_author','author');bind('e_topic','topic');bind('e_semonly','semonly');
['interp','security','privacy','other'].forEach(c=>document.getElementById('c_'+c).addEventListener('change',e=>{state.cats[c]=e.target.checked;refresh();}));
function dateOut(){document.getElementById('dateout').textContent=(dates[state.dmin]||'')+'  →  '+(dates[state.dmax]||'');}
document.getElementById('dmin').addEventListener('input',e=>{state.dmin=Math.min(+e.target.value,state.dmax);e.target.value=state.dmin;dateOut();refresh();});
document.getElementById('dmax').addEventListener('input',e=>{state.dmax=Math.max(+e.target.value,state.dmin);e.target.value=state.dmax;dateOut();refresh();});
dateOut();

let physicsOn=true;
const btnPhysics=document.getElementById('btnPhysics');btnPhysics.classList.add('on');
btnPhysics.onclick=()=>{physicsOn=!physicsOn;net.setOptions({physics:{enabled:physicsOn}});btnPhysics.classList.toggle('on',physicsOn);btnPhysics.textContent=physicsOn?'물리 ON':'물리 OFF';};
let neighborsOnly=false;const btnN=document.getElementById('btnNeighbors');
btnN.onclick=()=>{neighborsOnly=!neighborsOnly;btnN.classList.toggle('on',neighborsOnly);if(!neighborsOnly){restoreDim();}else if(lastSel){focusNeighbors(lastSel);}};
document.getElementById('btnFit').onclick=()=>net.fit({animation:true});

// ---- search ----
const search=document.getElementById('search'),results=document.getElementById('results');
search.addEventListener('input',()=>{
  const q=search.value.trim().toLowerCase();
  if(!q){results.style.display='none';results.innerHTML='';return;}
  const hits=G.nodes.filter(n=>n.title.toLowerCase().includes(q)||(n.authors||[]).join(' ').toLowerCase().includes(q)).slice(0,30);
  results.innerHTML=hits.map(n=>`<div class="r" data-id="${n.id}"><div>${esc(n.title)}</div><div class="c">${n.cat} · ${n.date} · ${n.id}</div></div>`).join('')||'<div class="r c">결과 없음</div>';
  results.style.display='block';
});
results.addEventListener('click',e=>{const r=e.target.closest('.r');if(!r||!r.dataset.id)return;selectNode(r.dataset.id);results.style.display='none';search.value='';});

// ---- selection / detail ----
let lastSel=null;
net.on('click',p=>{if(p.nodes.length){selectNode(p.nodes[0]);}else{document.getElementById('detail').style.display='none';lastSel=null;if(neighborsOnly)restoreDim();}});
function selectNode(id){
  lastSel=id;net.selectNodes([id]);net.focus(id,{scale:1.15,animation:{duration:450}});
  showDetail(id);if(neighborsOnly)focusNeighbors(id);
}
function relItems(list, kind){
  if(!list||!list.length) return '<div class="item c" style="color:var(--mut)">없음</div>';
  return list.slice(0,12).map(x=>{
    let id,lab='';
    if(kind==='cite'){id=(x.to||x.from);lab=`<span class="lab" style="background:${SUB[x.subtype]||SUB.cite}">${SUBLAB[x.subtype]||'인용'}</span>`;}
    else if(kind==='citedby'){id=x.from;lab=`<span class="lab" style="background:${SUB[x.subtype]||SUB.cite}">${SUBLAB[x.subtype]||'인용'}</span>`;}
    else{id=x;}
    const n=byId[id];if(!n)return '';
    return `<div class="item">${lab}<span class="t"><a href="#" onclick="selectNode('${id}');return false;">${esc(n.label)}</a></span></div>`;
  }).join('');
}
function showDetail(id){
  const n=byId[id];if(!n)return;
  const pdf=`../papers/${n.folder}/pdfs/${id}.pdf`;
  const el=document.getElementById('detBody');
  el.innerHTML=`
    <span class="badge" style="background:${CAT[n.cat]||CAT.other}">${n.cat}</span>
    <span class="meta">· ${n.date} · ${n.indeg} 회 피인용(코퍼스 내)</span>
    <h2>${esc(n.title)}</h2>
    <div class="meta">${(n.authors||[]).slice(0,8).join(', ')||'저자 미상'}</div>
    <div class="kw">${(n.keywords||[]).slice(0,8).map(k=>`<span>${esc(k)}</span>`).join('')}</div>
    <a class="linkbtn" href="https://arxiv.org/abs/${id}" target="_blank">arXiv ↗</a>
    <a class="linkbtn" href="${pdf}" target="_blank">PDF ↗</a>
    <div class="rel">
      <h3>이 논문이 인용 → (${(outC[id]||[]).length})</h3>${relItems(outC[id],'cite')}
      <h3>← 이 논문을 인용 (${(inC[id]||[]).length})</h3>${relItems(inC[id],'citedby')}
      <h3>공저자 연결 (${(auth[id]||[]).length})</h3>${relItems([...new Set(auth[id]||[])],'x')}
      <h3>주제 유사 (${(topi[id]||[]).length})</h3>${relItems([...new Set(topi[id]||[])],'x')}
    </div>`;
  document.getElementById('detail').style.display='block';
}
function focusNeighbors(id){
  const keep=new Set([id]);
  (outC[id]||[]).forEach(e=>keep.add(e.to));(inC[id]||[]).forEach(e=>keep.add(e.from));
  (auth[id]||[]).forEach(x=>keep.add(x));(topi[id]||[]).forEach(x=>keep.add(x));
  nodesDS.forEach(n=>{nodesDS.update({id:n.id,hidden:!keep.has(n.id)});});
}
function restoreDim(){nodesDS.forEach(n=>{if(n.hidden)nodesDS.update({id:n.id,hidden:false});});}

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shade(hex){return hex;}
window.selectNode=selectNode;

// ---- stats / subtitle ----
const m=G.meta||{};
document.getElementById('subtitle').textContent=`${m.n_nodes||G.nodes.length} papers · 갱신 ${m.generated||''}`;
const ec=m.edge_counts||{},sc=m.cite_subtypes||{};
document.getElementById('stats').innerHTML=
  `노드 <b style="color:#e6e8ec">${m.n_nodes||G.nodes.length}</b> · 인용 ${ec.cite||0} · 공저자 ${ec.author||0} · 주제 ${ec.topic||0}`+
  (m.semantic_labeled?` · 의미라벨 ${m.semantic_labeled}`:'');
</script>
</body>
</html>
